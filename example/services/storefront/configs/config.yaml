# ==============================================================================
# Storefront 服务配置 (example/services/storefront/configs/config.yaml)
# ==============================================================================

# 1. 应用基础元数据
app:
  name: "storefront"              # 业务服务名称

# 2. HTTP Web 服务
server:
  port: "8082"                    # 服务监听端口
  cors_allowed_origins:
    - "http://localhost:3000"     # 允许的前端 Origin
  cors_allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "X-User"

# 3. 用户认证 (JWT / X-User)
auth:
  enabled: true
  dev_header_user: true           # 联调允许 X-User 传递身份 (透传至下游服务)

# 4. OpenTelemetry 遥测套件
otel:
  enabled: true
  service_name: "storefront"
  endpoint: "localhost:4317"
  protocol: "grpc"
  insecure: true
  traces:
    enabled: true
    exporter: "otlp"
  metrics:
    enabled: true
    exporter: "otlp"
  logs:
    enabled: true
    exporter: "otlp"

# 5. 服务发现 (通过 Consul 动态寻址并调用下游服务)
discovery:
  consul_address: "http://localhost:8500" # Consul 注册中心地址
  consul_passing_only: true               # 仅路由至健康的节点
  register: true                          # 自身注册至 Consul
  tags:
    - "traefik.enable=true"
    - "traefik.http.routers.storefront.rule=PathPrefix(`/digest`) || PathPrefix(`/storefront`)"

# 6. 业务私有配置段
storefront:
  catalog_name: "catalog"         # 下游目标服务名称 (由 reqx 通过 Consul 自动发现并负载均衡)
  catalog_seed: "127.0.0.1:8081"  # 当 Consul 不可用时的备选回退种子地址
