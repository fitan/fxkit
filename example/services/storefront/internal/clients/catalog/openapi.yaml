info:
  title: catalog
  version: 1.0.0
openapi: 3.0.3
paths:
  /articles:
    get:
      operationId: listarticles
      parameters:
        - description: "Filter conditions (AND). Example: state=Running. OR group: or(a=1,b=2)"
          explode: true
          in: query
          name: q
          schema:
            description: "Filter conditions (AND). Example: state=Running. OR group: or(a=1,b=2)"
            items:
              type: string
            nullable: true
            type: array
        - description: Max rows per page
          explode: false
          in: query
          name: limit
          schema:
            default: 100
            description: Max rows per page
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        - description: Offset from 0 (ignored when cursor is set)
          explode: false
          in: query
          name: start
          schema:
            default: 0
            description: Offset from 0 (ignored when cursor is set)
            format: int64
            minimum: 0
            type: integer
        - description: Sort field, supports relation paths e.g. cluster.name
          explode: false
          in: query
          name: sortBy
          schema:
            description: Sort field, supports relation paths e.g. cluster.name
            type: string
        - explode: false
          in: query
          name: sortDirection
          schema:
            default: asc
            enum:
              - asc
              - desc
            type: string
        - description: Include total count (not with cursor)
          explode: false
          in: query
          name: replyWithCount
          schema:
            default: false
            description: Include total count (not with cursor)
            type: boolean
        - description: Opaque keyset cursor from previous nextCursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor from previous nextCursor
            type: string
        - description: Return nextCursor on first page
          explode: false
          in: query
          name: useCursor
          schema:
            default: false
            description: Return nextCursor on first page
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResultArticleListRow"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List articles (q= / cursor)
      tags:
        - Articles
    post:
      operationId: createarticles
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArticleReq"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create
      tags:
        - Articles
  /articles/{id}:
    delete:
      operationId: deletearticles
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete
      tags:
        - Articles
    get:
      operationId: getarticles
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get
      tags:
        - Articles
    put:
      operationId: updatearticles
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateArticleReq"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update
      tags:
        - Articles
  /authz/bindings:
    get:
      operationId: listAuthzBindings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBindingsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 列出全部用户→角色绑定
      tags:
        - Authz
  /authz/permissions:
    get:
      description: 返回已登记的 path/method + Huma 元数据
      operationId: listAuthzPermissions
      parameters:
        - description: 模糊搜索 method/path/summary 等
          explode: false
          in: query
          name: q
          schema:
            description: 模糊搜索 method/path/summary 等
            type: string
        - explode: false
          in: query
          name: start
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            default: 20
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: replyWithCount
          schema:
            default: true
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPermissionsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 列出 API 权限目录
      tags:
        - Authz
    post:
      operationId: createAuthzPermission
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 创建权限目录项
      tags:
        - Authz
  /authz/permissions/{id}:
    delete:
      description: 仅删除目录元数据，不删除 Casbin 策略
      operationId: deleteAuthzPermission
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 删除权限目录项
      tags:
        - Authz
    get:
      operationId: getAuthzPermission
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 获取权限目录项
      tags:
        - Authz
    put:
      operationId: updateAuthzPermission
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            minimum: 0
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 更新权限目录项
      tags:
        - Authz
  /authz/policies:
    get:
      operationId: listAuthzPolicies
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPoliciesBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 列出全部 Casbin 策略
      tags:
        - Authz
  /authz/roles:
    get:
      operationId: listAuthzRoles
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRolesBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 列出角色
      tags:
        - Authz
    post:
      operationId: createAuthzRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRecord"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 创建/更新角色
      tags:
        - Authz
  /authz/roles/{role}:
    delete:
      description: 删除角色元数据及其全部权限与用户绑定
      operationId: deleteAuthzRole
      parameters:
        - in: path
          name: role
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 删除角色
      tags:
        - Authz
    get:
      operationId: getAuthzRole
      parameters:
        - in: path
          name: role
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleRecord"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 获取角色
      tags:
        - Authz
  /authz/roles/{role}/permissions:
    delete:
      operationId: removeAuthzRolePermission
      parameters:
        - in: path
          name: role
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: path
