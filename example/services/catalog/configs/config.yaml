# ==============================================================================
# Catalog 服务配置 (example/services/catalog/configs/config.yaml)
# ==============================================================================

# 1. 应用基础元数据
app:
  name: "catalog"                 # 服务唯一标识 (Consul 注册名、Huma 文档名)

# 示例/本地调试：暴露 Huma 自带 spec 端点 (/huma/openapi.{yaml,json})。
# 生产环境保持默认关闭，或由网关/鉴权保护。
huma:
  public_spec: true
  # schema_links: true            # 需要响应 JSON 的 $schema / Link 时打开

# 2. HTTP 监听与中间件
server:
  port: "8081"                    # 服务监听端口
  log_payloads: false             # 是否打印请求体/响应体日志
  cors_allowed_origins:
    - "http://localhost:3000"     # 允许的前端开发域名
  cors_allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "X-User"
  pprof:
    enabled: false                # 本地排查性能时打开；默认关闭，避免暴露运行时信息
    prefix: "/debug/pprof/"
  security_headers:
    enabled: true
    hsts: false
    csp: ""
  csrf:
    enabled: false
    cookie_name: "csrf_token"
    header_name: "X-CSRF-Token"

# 3. 数据库与持久化
db:
  driver: "postgres"              # 驱动类型: postgres
  dsn: "postgres://fxkit:fxkit@localhost:5432/fxkit?sslmode=disable" # 数据库连接串
  log_level: "warn"               # GORM 日志级别 (避免打印全部正常 SQL)
  slow_threshold: 200ms           # 慢查询告警阈值
  max_idle_conns: 10              # 最大空闲连接数
  max_open_conns: 100             # 最大打开连接数
  conn_max_lifetime: 1h           # 单个连接最长生命周期
  auto_migrate: true              # 本地开发自动建表；生产应由 SQL 平台执行 `migrate print` 的 DDL
  check_schema: false             # 生产建议 true：启动时校验表/列是否存在

# 4. 事务发件箱
outbox:
  enabled: true                   # 启用发件箱 (保证业务操作与事件发布强一致性)
  poll_interval: 1s               # 后台轮询扫描间隔
  batch_size: 50                  # 批量处理上限
  max_retries: 10                 # 发布重试上限
  claim_timeout: 30s              # 故障转移租约超时时间
  purge_interval: 1h              # 自动清理已发布/failed 的间隔；0 = 关闭
  purge_before: 168h              # 只清理早于该时间的行
  inbox_purge_before: 168h        # 清理已完成的 inbox 行
  partition_field: ""             # 设置后同值事件在单批内串行（如 "actorId"）；空 = 不分组

# 5. Hatchet 任务编排引擎
hatchet:
  enabled: true                   # 启用 Hatchet 分布式任务引擎
  token: ""                       # 凭证 Token (留空则从 tmp/hatchet.token 或环境变量自动拉取)
  host_port: "10.170.34.223:7077" # Hatchet 引擎通信 gRPC 地址
  server_url: "http://10.170.34.223:8088" # Hatchet REST (dashboard/API)；不是 Kite/控制台端口
  tls_strategy: "none"            # gRPC 连接安全策略 (本地明文通信必须为 none)
  worker_name: "catalog-worker"   # 注册至 Hatchet 的 Worker 标识
  outbox_publisher: true          # 将 outbox 的事件发布者接入 Hatchet
  otel: true                      # 开启 Worker 步骤的链路追踪

# 6. 用户认证与 Casbin 权限引擎
auth:
  enabled: true                   # 启用鉴权
  issuer: "https://10.170.34.223:3001/oidc"
  audience: "https://fxkit.showcase/api"
  jwks_url: "https://10.170.34.223:3001/oidc/jwks"
  tls_insecure: true              # Logto 在裸 IP 上用自签证书
  dev_header_user: true           # 本地联调开启 X-User 头认证 (生产环境请设为 false)
  dev_org_id: "demo"              # Casbin domain（不是数据隔离）；生产由 JWT org claim 提供
  public_paths:                   # 完全放行的路径前缀
    - "/public"
    - "/payments/webhook"
  casbin:
    enabled: true                 # 启用 Casbin RBAC 细粒度接口权限判定
    table_name: "casbin_rule"     # 权限规则存储表
    auto_register_routes: true    # 启动时自动将所有 API 路由注册为权限资源
    bootstrap_role: "admin"       # 初始管理员角色
    bootstrap_users:              # 启动时自动赋予 admin 角色的用户列表
      - "alice"
    auto_bind_bootstrap: false    # 是否自动为未知用户赋予管理员权限 (严禁在生产开启)
    reload_interval: 5s           # 多副本定期从数据库同步最新权限策略的间隔

# 7. 审计（opt-in）
audit:
  enabled: false
  sink: "slog"                    # slog | db | outbox
  include_body: false
  include_headers: false
  retention: 720h

# 8. 幂等（opt-in）
idempotency:
  enabled: true
  header: "Idempotency-Key"
  ttl: 24h
  methods: [POST, PUT, PATCH, DELETE]
  max_body_bytes: 1048576
  store: "db"
  purge_interval: 1h

# 9. 多租户已移除：框架默认单租户。如未来需要，请在数据层单独设计。

# 10. OpenTelemetry 可观测性
otel:
  enabled: true                   # 启用 OpenTelemetry 遥测套件
  service_name: "catalog"         # 遥测服务名称
  service_version: "0.1.0"        # 遥测版本标识
  environment: "development"      # 部署运行环境
  endpoint: "10.170.34.223:4317"  # OTLP gRPC 采集端
  protocol: "grpc"                # 通信协议 (gRPC)
  insecure: true                  # 非 TLS 明文传输
  sampling: "always_on"           # 采样率策略 (开发模式全采样)
  traces:
    enabled: true
    exporter: "otlp"
  metrics:
    enabled: true
    exporter: "otlp"
    runtime_metrics: true         # 自动收集 Go 运行时指标
  logs:
    enabled: true
    exporter: "otlp"

# 11. 服务注册与服务发现
discovery:
  consul_address: "http://localhost:8500" # Consul 服务注册中心地址
  consul_passing_only: true               # 客户端仅拉取健康的实例
  register: true                          # 自动将当前 catalog 服务实例注册到 Consul
  advertise_address: ""                   # 对外通告 IP (留空自动嗅探当前机内网 IP)
  tags:                                   # 额外元数据标签 (供网关路由解析)
    - "traefik.enable=true"
    - "traefik.http.routers.catalog.rule=PathPrefix(`/articles`) || PathPrefix(`/comments`) || PathPrefix(`/catalog`)"
    - "traefik.http.routers.catalog.middlewares=catalog-strip@file"

# 12. 业务自定义私有配置段
catalog:
  reminder_period: "*/15 * * * * *"       # 定时心跳 Cron 表达式 (每 15 秒触发一次)

# 13. 支付（示例）
payments:
  provider: "mock"
  webhook_secret: "dev-webhook-secret"

# 14. 可选能力演示（/demo/*；热更新走 Consul KV 的 demo 段）
demo:
  welcome: "hello from config"

# 15. MCP（默认关闭；开启后 /mcp 暴露 Huma operation 为 tools）
mcp:
  enabled: false
  path: "/mcp"
  # include_tools: ["getPayment", "listArticles"]   # 生产建议白名单
